# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
      - master
    # Só redeploya o relay quando algo que ele de fato usa muda — um push
    # que só mexe em webgame/ (front-end, servido pelo GitHub Pages) não
    # deveria derrubar as conexões WebSocket de partidas em andamento.
    paths:
      - "scripts/relay_core.py"
      - "scripts/relay_server.py"
      - "scripts/requirements.txt"
      - "Dockerfile"
      - "fly.toml"
      - ".github/workflows/fly-deploy.yml"
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
